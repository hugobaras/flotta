services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: transport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transport-dev}
      POSTGRES_DB: transport
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transport"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7-alpine

  api:
    build: ./api
    environment:
      REDIS_URL: redis://redis:6379/0
      VALHALLA_URL: ${VALHALLA_URL:-http://valhalla:8002}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER: ${BREVO_SENDER:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgresql+psycopg://transport:${POSTGRES_PASSWORD:-transport-dev}@db/transport
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ./api
    command: celery -A app.worker.celery worker -B -l info
    environment:
      DATABASE_URL: postgresql+psycopg://transport:${POSTGRES_PASSWORD:-transport-dev}@db/transport
      UPLOAD_DIR: /data/uploads
      REDIS_URL: redis://redis:6379/0
      VALHALLA_URL: ${VALHALLA_URL:-http://valhalla:8002}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER: ${BREVO_SENDER:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
    volumes:
      - uploads:/data/uploads
    depends_on:
      - api
      - redis

  # Routage poids lourd : démarré à la demande (`docker compose --profile routage up -d valhalla`).
  # Le premier démarrage télécharge la carte France (environ 4,5 Go) et construit les tuiles (1 à 2 heures).
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    profiles: ["routage"]
    ports:
      - "8002:8002"
    volumes:
      - ./valhalla/custom_files:/custom_files
    environment:
      tile_urls: https://download.geofabrik.de/europe/france-latest.osm.pbf
      use_tiles_ignore_pbf: "True"
      force_rebuild: ${VALHALLA_FORCE_REBUILD:-False}
      build_admins: "True"
      build_time_zones: "True"
      build_elevation: "False"
      server_threads: 4

  web:
    build: ./web
    environment:
      PORT: 3000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
